<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GW — Genome Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100vh;      /* fallback */
      height: 100dvh;     /* dynamic viewport — accounts for browser chrome */
      overflow: hidden;
      background: #1a1a2e;
      display: flex; flex-direction: column;
    }

    /* Canvas container fills the remaining space over the canvas */
    #gw-canvas-container {
      flex: 1 1 0;
      min-height: 0;      /* prevents flex children from overflowing */
      position: relative;
      overflow: hidden;
    }

    /* Loading overlay — hidden once GW starts */
    #gw-loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #1a1a2e; color: #ccc;
      font-family: monospace; font-size: 14px;
      z-index: 10;
    }
    #gw-loading progress { margin-top: 12px; width: 220px; }

    /* WebGL canvas — fills its container div */
    canvas#canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      touch-action: none;  /* touches drive GW, not page scrolling or zooming */
    }

    /* Receives on-screen keyboard text for GW; 16px stops iOS zooming in on focus */
    #gw-text-proxy {
      position: fixed; top: 0; left: 0;
      width: 1px; height: 1px; border: 0; padding: 0;
      opacity: 0; font-size: 16px;
      pointer-events: none;
    }

    /* Toast notification — bottom left, above the chromosome bar, so it never covers
       the top menu buttons; it is informational only and lets clicks through */
    #gw-toast {
      position: absolute; bottom: 52px; left: 8px;
      pointer-events: none;
      padding: 8px 12px;
      background: rgba(0,0,0,0.85);
      color: #9f9;
      border-radius: 4px;
      font-family: monospace; font-size: 11px;
      max-width: 340px; word-break: break-all;
      white-space: pre-wrap;
      z-index: 6;
      display: none;
    }
  </style>
</head>
<body>
  <div id="gw-loading">
    <span id="gw-status">Loading GW…</span>
    <progress id="gw-progress" value="0" max="100"></progress>
  </div>

  <div id="gw-canvas-container">
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="gw-toast"></div>
  </div>
  <input id="gw-text-proxy" type="text" tabindex="-1" aria-hidden="true"
         autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

  <!-- Hidden file picker (accepts common genomic formats) -->
  <input id="gw-file-input" type="file" multiple style="display:none"
         accept=".fa,.fasta,.fai,.gzi,.bam,.bai,.csi,.sam,.cram,.crai,.vcf,.bcf,.tbi,.bed,.gff,.gff3,.gtf,.bw,.bb,.bigwig,.bigbed,.gz,.bgz,.tsv,.txt,.png">

  <script>
    var statusEl   = document.getElementById('gw-status');
    var progressEl = document.getElementById('gw-progress');
    var loadingEl  = document.getElementById('gw-loading');
    var fileInput  = document.getElementById('gw-file-input');
    var toast      = document.getElementById('gw-toast');

    // ── Canvas resize ─────────────────────────────────────────────────────────
    // Keep canvas pixel dimensions in sync with its CSS container.
    // Called before callMain() (sets initial size) and by ResizeObserver on
    // every browser-window resize (updates canvas + notifies GW via C export).
    var gwContainer = document.getElementById('gw-canvas-container');
    var gwCanvas    = document.getElementById('canvas');
    // Set to true after callMain() completes so syncCanvasSize knows GW is live.
    // Module._gw_notify_resize exists before callMain() (EMSCRIPTEN_KEEPALIVE),
    // so we cannot use its presence as the "GW is running" signal.
    var gwRunning = false;
    function syncCanvasSize() {
      var w = gwContainer.clientWidth;
      var h = gwContainer.clientHeight;
      if (w <= 0 || h <= 0) return;

      if (gwRunning) {
        // GW is running: glfwSetWindowSize (inside gw_notify_resize) resizes
        // the canvas and fires the GLFW callback → resizeTriggered → Skia rebuild.
        Module._gw_notify_resize(w, h);
      } else {
        // Before callMain(): set the canvas pixel buffer directly so the
        // EM_ASM_INT in C++ init reads the container dimensions, not 300×150.
        gwCanvas.width  = w;
        gwCanvas.height = h;
      }
    }
    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(syncCanvasSize).observe(gwContainer);
    } else {
      window.addEventListener('resize', syncCanvasSize);
    }

    // ── Toast helper ─────────────────────────────────────────────────────────
    function showToast(msg, ms) {
      toast.textContent = msg;
      toast.style.display = 'block';
      clearTimeout(toast._t);
      toast._t = setTimeout(function() { toast.style.display = 'none'; }, ms || 5000);
    }

    // ── Touch input ──────────────────────────────────────────────────────────
    // The GLFW port only listens for mouse events, so a one-finger touch is replayed
    // as a mouse drag. Moving before pressing lets ImGui hit-test the touched point.
    // preventDefault also stops Safari sending its own delayed mouse events and
    // zooming the whole page on a pinch.
    var activeTouch = null;
    // Two fingers zoom instead: each 25% change in their spread sends one wheel
    // step, the same zoom step as a mouse wheel notch. pinch = {a, b, spread}.
    var pinch = null;
    var PINCH_STEP = 1.25;
    function sendMouse(type, touch) {
      gwCanvas.dispatchEvent(new MouseEvent(type, {
        bubbles: true, cancelable: true, view: window,
        button: 0, buttons: type === 'mouseup' ? 0 : 1,
        clientX: touch.clientX, clientY: touch.clientY,
        screenX: touch.screenX, screenY: touch.screenY
      }));
    }
    function findTouch(list, id) {
      for (var i = 0; i < list.length; ++i) if (list[i].identifier === id) return list[i];
      return null;
    }
    function spread(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) || 1; }
    function startDrag(touch) {
      activeTouch = touch.identifier;
      sendMouse('mousemove', touch);
      sendMouse('mousedown', touch);
    }
    gwCanvas.addEventListener('touchstart', function(event) {
      event.preventDefault();
      if (!gwRunning || pinch) return;
      if (activeTouch === null && event.touches.length >= 2) {
        var t0 = event.touches[0], t1 = event.touches[1];
        pinch = {a: t0.identifier, b: t1.identifier, spread: spread(t0, t1)};
        return;
      }
      if (activeTouch === null) { startDrag(event.changedTouches[0]); return; }
      // A second finger ends the drag where the first finger is and starts a pinch.
      var first = findTouch(event.touches, activeTouch);
      var second = event.changedTouches[0];
      if (!first || second.identifier === activeTouch) return;
      sendMouse('mouseup', first);
      activeTouch = null;
      pinch = {a: first.identifier, b: second.identifier, spread: spread(first, second)};
    }, {passive: false});
    gwCanvas.addEventListener('touchmove', function(event) {
      event.preventDefault();
      if (pinch) {
        var a = findTouch(event.touches, pinch.a), b = findTouch(event.touches, pinch.b);
        if (!a || !b) return;
        var now = spread(a, b);
        var wheel = {bubbles: true, cancelable: true, view: window, deltaMode: 0,
                     clientX: (a.clientX + b.clientX) / 2, clientY: (a.clientY + b.clientY) / 2};
        // Spreading zooms in (wheel up); pinching together zooms out (wheel down).
        while (now >= pinch.spread * PINCH_STEP) {
          pinch.spread *= PINCH_STEP;
          gwCanvas.dispatchEvent(new WheelEvent('wheel', Object.assign({deltaY: -100}, wheel)));
        }
        while (now <= pinch.spread / PINCH_STEP) {
          pinch.spread /= PINCH_STEP;
          gwCanvas.dispatchEvent(new WheelEvent('wheel', Object.assign({deltaY: 100}, wheel)));
        }
        return;
      }
      var touch = findTouch(event.changedTouches, activeTouch);
      if (touch) sendMouse('mousemove', touch);
    }, {passive: false});
    function endTouch(event) {
      event.preventDefault();
      if (pinch) {
        if (!findTouch(event.changedTouches, pinch.a) && !findTouch(event.changedTouches, pinch.b)) return;
        // The finger still down carries on as a drag.
        var rest = findTouch(event.touches, pinch.a) || findTouch(event.touches, pinch.b);
        pinch = null;
        if (rest) startDrag(rest);
        return;
      }
      var touch = findTouch(event.changedTouches, activeTouch);
      if (!touch) return;
      activeTouch = null;
      sendMouse('mouseup', touch);
      // Browsers open the keyboard only for a focus made inside the gesture. Tapping
      // a text box has made GW want text by the time the finger lifts.
      if (event.type === 'touchend' && Module._gw_wants_text_input()) textProxy.focus();
    }
    gwCanvas.addEventListener('touchend', endTouch, {passive: false});
    gwCanvas.addEventListener('touchcancel', endTouch, {passive: false});
    // Safari's own pinch event; cancelling it is a backstop against page zoom.
    gwCanvas.addEventListener('gesturestart', function(event) { event.preventDefault(); });

    // ── On-screen keyboard ───────────────────────────────────────────────────
    // GW reads keys only while its canvas has focus, so text typed into the hidden
    // field is forwarded. A one-space value lets Backspace register as a deletion.
    var textProxy = document.getElementById('gw-text-proxy');
    var textProxyKeys = {Escape: 256, Enter: 257, Tab: 258, Delete: 261,
                         ArrowRight: 262, ArrowLeft: 263, ArrowDown: 264, ArrowUp: 265};
    function resetTextProxy() { textProxy.value = ' '; textProxy.setSelectionRange(1, 1); }
    textProxy.addEventListener('focus', resetTextProxy);
    // GW must not see the canvas lose focus (ImGui would end the edit) or receive
    // the field's key events a second time through GLFW's document listener.
    gwCanvas.addEventListener('blur', function(event) {
      if (event.relatedTarget === textProxy) event.stopImmediatePropagation();
    });
    textProxy.addEventListener('keyup', function(event) { event.stopPropagation(); });
    textProxy.addEventListener('keydown', function(event) {
      event.stopPropagation();
      var key = textProxyKeys[event.key];
      if (key === undefined) return;
      event.preventDefault();
      Module._gw_text_key(key);
    });
    textProxy.addEventListener('input', function(event) {
      if (event.inputType && event.inputType.indexOf('delete') === 0) Module._gw_text_key(259);  // Backspace
      else if (event.data) for (var ch of event.data) Module._gw_text_char(ch.codePointAt(0));
      resetTextProxy();
    });
    // Close the keyboard once GW stops wanting text (Enter, Escape or a tap elsewhere).
    (function watchTextProxy() {
      if (gwRunning && document.activeElement === textProxy && !Module._gw_wants_text_input()) {
        textProxy.blur();
        gwCanvas.focus();
      }
      requestAnimationFrame(watchTextProxy);
    })();

    // Files stay in the browser. Only requested ranges enter WASM memory.
    var localLoader;
    var localLoaderReady=import('./local-files.mjs').then(function(api){
      return api;
    });
    function ensureLocalLoader(api){
      if(localLoader)return localLoader;
      localLoader=api.createLocalLoader({FS:FS,Module:Module,command:runLocalCommand,status:function(text){
        clearTimeout(toast._t);toast.textContent=text;toast.style.display=text?'block':'none';
      }});
      return localLoader;
    }
    var localFileOptions={track:true,tiles:false};
    function importFiles(files){
      if(!gwRunning){showToast('Wait for GW to finish loading');return;}
      localLoaderReady.then(function(api){return ensureLocalLoader(api).accept(files,localFileOptions);}).catch(function(error){showToast(error.message);});
    }
    window.gwOpenFiles=function(reference,track,tiles){
      localFileOptions={track:!!track,tiles:!!tiles};
      fileInput.accept=reference?'.fa,.fasta,.fai':tiles&&!track?'.vcf,.bed':'.fa,.fasta,.fai,.bam,.bai,.csi,.vcf,.bed,.gff,.gff3,.gtf,.bw,.bb,.bigwig,.bigbed';
      fileInput.value='';fileInput.click();
    };
    document.addEventListener('dragover',function(event){event.preventDefault();});
    document.addEventListener('drop',function(event){event.preventDefault();importFiles(Array.from(event.dataTransfer.files));});
    fileInput.addEventListener('change',function(){importFiles(Array.from(fileInput.files));fileInput.value='';});

    // ── Emscripten Module ─────────────────────────────────────────────────────
    var Module = {
      canvas: (function() {
        var c = document.getElementById('canvas');
        c.addEventListener('webglcontextlost', function(e) {
          alert('WebGL context lost — please reload the page.');
          e.preventDefault();
        }, false);
        return c;
      })(),

      // Do NOT run main() automatically — we start it after persistent storage
      // is synchronised so that readIni() sees /persistent/.gw.ini.
      noInitialRun: true,

      onRuntimeInitialized: function() {
        // Mount IndexedDB-backed filesystem so .gw.ini persists across reloads.
        try {
          FS.mkdir('/persistent');
          FS.mount(IDBFS, {}, '/persistent');
          // Sync IndexedDB → MemFS (first=true), then start GW.
          FS.syncfs(true, function(err) {
            if (err) console.warn('[GW] IDBFS initial sync error:', err);
            startGW();
          });
        } catch(e) {
          console.warn('[GW] Persistent storage (IDBFS) unavailable:', e);
          startGW();
        }
      },

      setStatus: function(text) {
        if (!text) return;  // empty = "done" — loading overlay hidden by startGW()
        statusEl.textContent = text;
        var m = text.match(/\((\d+)\/(\d+)\)/);
        if (m) {
          progressEl.value = parseInt(m[1]);
          progressEl.max   = parseInt(m[2]);
        }
      },

      print: function() {
        return function() {
          console.log(Array.prototype.slice.call(arguments).join(' '));
        };
      }(),

      printErr: function(text) { console.error(text); },
      onAbort: function(reason) {
        var wasRunning=gwRunning;
        gwRunning = false;
        loadingEl.style.display = 'flex';
        progressEl.style.display = 'none';
        statusEl.textContent = (wasRunning?'GW runtime error: ':'GW could not start: ') + reason;
        notifyHost('error',{error:String(reason)});
      }
    };

    Module.gwCommandQueue=[];
    function runLocalCommand(text){
      if(typeof text!=='string' || !text.trim() || text.length>4096 || /[\r\n]/.test(text) || /^(q|quit|exit)( |$)/.test(text))
        return Promise.reject(new Error('Invalid browser command'));
      return new Promise(function(resolve,reject){Module.gwCommandQueue.push({text:text,resolve:resolve,reject:reject});});
    }
    var onlineModule=import('./online-files.mjs');
    var onlineController;
    Module.gwOnlineCancel=function(){if(!onlineController || Module.gwOnlineCommitting)return;Module.gwOnlineCancelled=true;onlineController.abort();};
    Module.gwFetchCatalogue=async function(url){
      try{var api=await onlineModule;Module.gwCatalogueResult=await api.fetchCatalogue(url);}
      catch(error){Module.gwCatalogueResult='error:'+error.message;}
    };
    Module.gwDiscoverOnline=async function(url){
      try{var api=await onlineModule;Module.gwDiscoveryResult=await api.fetchCatalogue(url)||'error:Empty metadata response';}
      catch(error){Module.gwDiscoveryResult='error:'+error.message;}
    };
    Module.gwOnlineFileSize=async function(url){
      try{var api=await onlineModule;Module.gwDiscoveryResult=String(await api.fileSize(url));}
      catch(ignore){Module.gwDiscoveryResult='-1';}
    };
    Module.gwDownloadOnline=async function(encoded,asTrack,checkAssembly,asTable,directory){
      onlineController=new AbortController();Module.gwOnlineCancelled=false;Module.gwOnlineCommitting=false;
      Module.gwDownloadReceived=0;Module.gwDownloadTotal=0;
      try{
        var api=await onlineModule,entries=[];
        for(var entry of JSON.parse(encoded).entries)entries.push(await api.downloadOnline(entry,{
          FS:FS,directory:directory,signal:onlineController.signal,
          progress:function(received,total){Module.gwDownloadReceived=received;Module.gwDownloadTotal=total;}
        }));
        if(onlineController.signal.aborted)throw new Error('Download cancelled');
        // Persist the files before registering a reference path in .gw.ini.
        if(directory.indexOf('/persistent/')===0)await new Promise(function(resolve,reject){FS.syncfs(false,function(error){if(error)reject(new Error('Could not persist downloaded files: '+error));else resolve();});});
        Module.gwOnlineAsTrack=asTrack;Module.gwOnlineAsTable=asTable;Module.gwOnlineCheckAssembly=checkAssembly;
        var text=JSON.stringify({version:1,entries:entries});
        if(entries.every(function(e){return e.format==='ucsc-raw';})){Module.gwOnlineResult='saved:'+text;return;}
        await new Promise(function(resolve,reject){Module.gwCommandQueue.push({text:'__gw_online '+text,resolve:resolve,reject:reject});});
        Module.gwOnlineResult='downloaded:'+text;showToast('Downloaded and opened');
      }catch(error){Module.gwOnlineResult='error:'+error.message;showToast(error.message);}
      finally{onlineController=null;Module.gwOnlineCommitting=false;}
    };
    Module.gwOpenOnline=async function(encoded,asTrack,checkAssembly,asTable){
      onlineController=new AbortController();Module.gwOnlineCancelled=false;
      var prepared=[];Module.gwOnlineCommitting=false;
      try{
        var api=await onlineModule;
        for(var entry of JSON.parse(encoded).entries)
          prepared.push(await api.prepareOnline(entry,{FS:FS,Module:Module,signal:onlineController.signal,status:showToast}));
        if(onlineController.signal.aborted)throw new Error('Cancelled');
        Module.gwOnlineAsTrack=asTrack;Module.gwOnlineAsTable=asTable;Module.gwOnlineCheckAssembly=checkAssembly;
        var text='__gw_online '+JSON.stringify({version:1,entries:prepared.map(function(p){return p.entry;})});
        await new Promise(function(resolve,reject){Module.gwCommandQueue.push({text:text,resolve:resolve,reject:reject});});
        showToast('Opened online file');Module.gwOnlineResult='opened';
      }catch(error){if(!Module.gwOnlineCommitting)for(var resource of prepared)resource.cleanup();showToast(error.message);Module.gwOnlineResult='error:'+error.message;}
      finally{onlineController=null;Module.gwOnlineCommitting=false;}
    };
    document.addEventListener('keydown',function(event){if(event.key==='Escape')Module.gwOnlineCancel();});
    Module.gwCompleteCommand=function(output){
      var action=Module.gwActiveCommand;Module.gwActiveCommand=null;
      if(!action)return;
      if(/error|not understood|invalid path/i.test(output))action.reject(new Error(output));
      else action.resolve(output);
    };
    var lastState='';
    Module.gwPublishState=function(state){
      Module.gwLastState=state;
      var encoded=JSON.stringify(state);
      if(encoded!==lastState){lastState=encoded;notifyHost('state',{value:state});}
    };
    var embedChannel=location.hash.slice(1), hostOrigin;
    try{hostOrigin=new URL(document.referrer).origin;}catch(ignore){}
    function notifyHost(type,extra){if(parent!==window && embedChannel && hostOrigin)parent.postMessage(Object.assign({channel:embedChannel,type:type},extra),hostOrigin);}
    window.addEventListener('message',async function(event){
      var message=event.data;
      if(event.source!==parent || event.origin!==hostOrigin || message?.channel!==embedChannel)return;
      if(message.type==='dispose'){notifyHost('disposed');return;}
      if(message.type!=='call')return;
      try{
        var value;
        if(message.method==='snapshot')value=Module.gwLastState;
        else if(message.method==='action' && message.value.type==='navigate')value=await runLocalCommand(message.value.region);
        else if(message.method==='action' && message.value.type==='command')value=await runLocalCommand(message.value.text);
        else throw new Error('Unsupported local viewer action');
        notifyHost('reply',{id:message.id,value:value});
      }catch(error){notifyHost('reply',{id:message.id,error:error.message});}
    });

    function startGW() {
      syncCanvasSize();  // sets canvas.width/height before GLFW window is created
      try {
        Module.callMain(Module['arguments'] || []);
      } catch(e) {
        // emscripten_set_main_loop(simulate_infinite_loop=1) throws ExitStatus(0)
        // to unwind the stack — that is expected, not an error.
        if (e !== 'unwind' && (!e || e.name !== 'ExitStatus' || e.status !== 0)) {
          Module.onAbort(e && e.message ? e.message : String(e));
          return;
        }
      }
      gwRunning = true;   // ResizeObserver now routes through gw_notify_resize
      loadingEl.style.display = 'none';
      gwCanvas.focus();
      notifyHost('ready');
    }

    window.onerror = function(msg, source, line, column, error) { console.error(error && error.stack || msg); Module.onAbort(msg); };
  </script>

  {{{ SCRIPT }}}
</body>
</html>
